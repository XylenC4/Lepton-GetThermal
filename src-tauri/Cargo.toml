[package]
name = "lepton-getthermal"
version = "0.2.0"
description = "Lepton-GetThermal — FLIR Lepton Thermal Camera Viewer"
authors = ["hmenzagh"]
edition = "2021"
license = "MIT"

[lib]
name = "lepton_getthermal_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[features]
# Simulated camera (synthetic thermal scene) for testing without hardware.
sim = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["devtools"] }  # right-click > Inspect in release builds
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
parking_lot = "0.12"
thiserror = "2"
libc = "0.2"

# ONNX super-resolution (desktop only; no prebuilt ONNX Runtime for Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = { version = "2.0.0-rc.12", features = ["ndarray"] }
ndarray = "0.17"


# libusb backend (Linux, Windows, Android). macOS keeps the native IOKit backend.
[target.'cfg(not(target_os = "macos"))'.dependencies]
libusb1-sys = { version = "0.7", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Devices_DeviceAndDriverInstallation"] }
